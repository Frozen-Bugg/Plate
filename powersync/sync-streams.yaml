  progress_photos:
    auto_subscribe: true
    query: SELECT * FROM progress_photos WHERE user_id = auth.user_id() AND deleted_at IS NULL

  daily_rollup:
    auto_subscribe: true
    query: SELECT * FROM daily_rollup WHERE user_id = auth.user_id() AND deleted_at IS NULL

