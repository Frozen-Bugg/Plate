  # Phase 4 (Coach). The conversation syncs so a thread started on the phone can
  # be read on the web, and so history renders offline. Memories sync too: a
  # coach whose notes you cannot see is one you cannot correct.
  coach_threads:
    auto_subscribe: true
    query: SELECT * FROM coach_threads WHERE user_id = auth.user_id() AND deleted_at IS NULL

  coach_messages:
    auto_subscribe: true
    query: SELECT * FROM coach_messages WHERE user_id = auth.user_id() AND deleted_at IS NULL

