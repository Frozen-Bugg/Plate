# PowerSync Sync Streams for Overload.
# Paste into the PowerSync dashboard (instance → Sync Streams) and deploy.
#
# Every stream is auto-subscribed, so a signed-in device receives all of its
# owner's rows with no client-side subscription code. Soft-deleted rows are
# filtered out here, so a delete removes the row from every device once synced.
# Keep this file in step with app/lib/core/db/powersync_schema.dart.

config:
  edition: 3

streams:
  profile:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()

  exercise_library:
    auto_subscribe: true
    query: SELECT * FROM exercises WHERE user_id IS NULL AND deleted_at IS NULL

  my_exercises:
    auto_subscribe: true
    query: SELECT * FROM exercises WHERE user_id = auth.user_id() AND deleted_at IS NULL

  programs:
    auto_subscribe: true
    query: SELECT * FROM programs WHERE user_id = auth.user_id() AND deleted_at IS NULL

  mesocycles:
