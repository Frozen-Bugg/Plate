    query: SELECT * FROM mesocycles WHERE user_id = auth.user_id() AND deleted_at IS NULL

  templates:
    auto_subscribe: true
    query: SELECT * FROM templates WHERE user_id = auth.user_id() AND deleted_at IS NULL

  template_exercises:
    auto_subscribe: true
    query: SELECT * FROM template_exercises WHERE user_id = auth.user_id() AND deleted_at IS NULL

  sessions:
    auto_subscribe: true
    query: SELECT * FROM sessions WHERE user_id = auth.user_id() AND deleted_at IS NULL

  session_exercises:
